[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hand-gesture-control"
version = "0.1.0"
description = "Hand gesture control MVP using MediaPipe and OpenCV."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# Keep in sync with requirements.txt
dependencies = [
  "opencv-python",
  "mediapipe",
  "pynput",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "black",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
